name: Release

# Push a tag like v0.1.0 to build a signed Android APK (EAS local build on this
# runner with the EAS-managed keystore; it does not use EAS build quota)
# and publish it as a GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7

      - name: Release notes must exist
        working-directory: .
        run: |
          if [ ! -s "release-notes/$GITHUB_REF_NAME.md" ]; then
            echo "::error::Write user-facing notes in release-notes/$GITHUB_REF_NAME.md (see release-notes/README.md)"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Tag must match app.json version
        run: |
          APP_VERSION=$(node -p "require('./app.json').expo.version")
          if [ "v$APP_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match app.json version $APP_VERSION"
            exit 1
          fi

      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK
        run: eas build --local --platform android --profile production --non-interactive --output "anistream-$GITHUB_REF_NAME.apk"

      - uses: softprops/action-gh-release@v3
        with:
          files: mobile/anistream-${{ github.ref_name }}.apk
          body_path: release-notes/${{ github.ref_name }}.md
