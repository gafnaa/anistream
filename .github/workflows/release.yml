name: Release

# Push a tag like v0.1.0 to build a signed Android APK on EAS
# and publish it as a GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci

      - name: Tag must match app.json version
        run: |
          APP_VERSION=$(node -p "require('./app.json').expo.version")
          if [ "v$APP_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match app.json version $APP_VERSION"
            exit 1
          fi

      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build on EAS
        id: build
        run: |
          eas build --platform android --profile production --non-interactive --wait --json > build.json
          echo "url=$(node -p "require('./build.json')[0].artifacts.buildUrl")" >> "$GITHUB_OUTPUT"

      - name: Download APK
        run: curl -fsSL -o "anistream-$GITHUB_REF_NAME.apk" "${{ steps.build.outputs.url }}"

      - uses: softprops/action-gh-release@v3
        with:
          files: mobile/anistream-${{ github.ref_name }}.apk
          generate_release_notes: true
