name: Preview APK

# Push a branch named preview/* to build a release-mode APK (EAS local build on
# this runner, so it does not use EAS build quota) without publishing it, so a release candidate can be smoke-tested on an emulator.
on:
  push:
    branches: ['preview/**']
  workflow_dispatch:

jobs:
  android:
    name: Android preview APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Build APK
        run: eas build --local --platform android --profile preview --non-interactive --output anistream-preview.apk
      - uses: actions/upload-artifact@v4
        with:
          name: anistream-preview-apk
          path: mobile/anistream-preview.apk
          retention-days: 7
