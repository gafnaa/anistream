name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web + API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: API modules load
        run: node --check server/index.js && node --check server/scraper.js

  mobile:
    name: Mobile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Generate Expo type declarations
        run: echo '/// <reference types="expo/types" />' > expo-env.d.ts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:downloads
      - run: npx -y expo-doctor@1.21.6  # 1.21.7 (2026-11-11) ships without @expo/env and crashes; unpin once fixed
      - name: Bundle Android JS
        run: npx expo export --platform android --output-dir /tmp/expo-export
